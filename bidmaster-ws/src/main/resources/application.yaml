spring:
  profiles:
    active: dev
  application:
    name: BidMaster
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bidmaster}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    schemas: public

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    dev.mostapha.bidmaster: DEBUG

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:bidmaster}

app:
  images:
    bucket-name: ${MINIO_BUCKET:bidmaster-images}
  security:
    jwt:
      secret: ${JWT_SECRET:YmlkbWFzdGVyLXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbi0yMDI2LTI1Ni1iaXRz}
      expiration-ms: 86400000

server:
  port: 8080