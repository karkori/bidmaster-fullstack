schema: spec-driven

context: |
  Language: Spanish
  All OpenSpec artifacts (proposal, specs, design, tasks) must be written in Spanish.
  Keep OpenSpec structural headings and SHALL/MUST/WHEN/THEN keywords in English.

  Project: BidMaster — plataforma de subastas online fullstack (monorepo).
  Root docs: AGENTS.md, docs/architecture/domain-model.md, docs/dev-strategy/.

  Backend (bidmaster-ws/):
  - Java 25 LTS, Spring Boot 3.5.16, Maven (./mvnw).
  - Architecture: Spring Web MVC + Virtual Threads (spring.threads.virtual.enabled=true) + SSE (SseEmitter via AuctionEventBroadcaster).
  - Persistence: Spring Data JPA (Hibernate ORM, ddl-auto=validate, open-in-view=false) + PostgreSQL 17 (prod/dev) + H2 PostgreSQL mode (test). Optimistic locking with @Version.
  - Migrations: Flyway SQL scripts in bidmaster-ws/src/main/resources/db/migration/V{N}__*.sql (V1 users, V2 auctions, V3 bids, V4 images).
  - Security & Storage: Spring Security 6 (BCrypt + Stateless JWT with jjwt 0.12.6), MinIO S3 (8.5.17), FileSignatureSecurityAdapter (binary magic bytes check; ClamAV was removed).
  - Error Handling: GlobalExceptionHandler returning RFC 7807 ProblemDetail (including 409 Conflict on optimistic locking).
  - Hexagonal Architecture under dev.mostapha.bidmaster:
    - domain/model/ & domain/event/ (pure Java domain entities with create/reconstitute factories, invariants, and domain events)
    - application/port/in/ (*UseCase), application/port/out/ (*Repository, *Port), application/service/
    - adapter/in/web/ (MVC @RestController, DTOs, mappers, @RestControllerAdvice)
    - adapter/out/ (persistence/entity, persistence/repository Jpa*, storage/, security/, event/)
    - config/ (SecurityConfig, JwtService, JwtAuthenticationFilter, MinioConfig, DevDataInitializer)
  - Tests: JUnit 5, domain unit tests (AuctionDomainTest), optimistic locking concurrency tests (ConcurrencyBidTest), and Karate 1.5.2 E2E API tests (src/test/resources/karate/*.feature).

  Frontend (bidmaster-front/):
  - Angular 21.2 LTS, TypeScript ~5.9 (strict), Tailwind CSS v4.3, Angular Material 21, Zod v4.6, date-fns v4, npm.
  - SSR & Prerendering enabled (@angular/ssr, express, zone.js with provideZoneChangeDetection). Browser-only APIs (localStorage, window, document) MUST be guarded with isPlatformBrowser(inject(PLATFORM_ID)).
  - Modern Angular APIs: standalone components, signal inputs/outputs/model() (input(), output(), model()), inject() DI, Signals/computed(), @if/@for/@defer control flow, default exports for lazy-loaded pages, Reactive Forms + Zod v4 schemas.
  - Path aliases: @core/*, @shared/*, @components/*, @pages/*, @layouts/*, @environments/*.
  - Tests: Karma + Jasmine (npm test using CHROME_BIN=/usr/bin/chromium, *.spec.ts).

  Infrastructure (docker-compose.yml):
  - PostgreSQL 17 (postgres:17-alpine, 5432) and MinIO (9000/9001).

rules:
  proposal:
    - Mantener la propuesta enfocada y clara, indicando explícitamente qué queda fuera de alcance (Out of Scope).
    - Referenciar las entidades, eventos de dominio o reglas de negocio afectadas de docs/architecture/domain-model.md cuando aplique.
  specs:
    - Definir escenarios verificables con formato GIVEN/WHEN/THEN para casos de éxito, validación, concurrencia y error.
    - Especificar contratos HTTP (método, ruta, códigos de estado RFC 7807 ProblemDetail, DTOs, SSE si aplica) cuando el cambio cruce frontend y backend.
  design:
    - Respetar estrictamente la arquitectura hexagonal en bidmaster-ws (dominio puro en domain/, puertos en application/, adaptadores JPA/Web/MinIO/Event en adapter/).
    - Detallar migraciones Flyway (V{N}__*.sql) si cambia el modelo de datos, mantener ddl-auto=validate y garantizar compatibilidad SSR en cambios de Angular.
    - Alinear exactamente rutas HTTP, DTOs Java y modelos TypeScript, considerando eventos SSE y optimistic locking cuando aplique.
  tasks:
    - Dividir las tareas por capa o módulo (BD/Flyway, Dominio/Eventos, Aplicación, Adaptadores, Frontend, Tests).
    - Incluir tareas explícitas de verificación (./mvnw test incluyendo Karate E2E, npm run build / npm test) y actualización documental si cambia el dominio.

operations:
  apply:
    guidance:
      - Verificar contratos entre bidmaster-ws (controllers/DTOs/ProblemDetail) y bidmaster-front (services/models/Zod v4) antes de dar una tarea por completada.
      - Ejecutar tests unitarios, de concurrencia y Karate E2E en backend, y build/tests en frontend; reportar cualquier limitación del entorno (ej. JDK o Chromium).
  archive:
    guidance:
      - Confirmar que specs/ y el código implementado están alineados y resumir las capacidades actualizadas al archivar.
